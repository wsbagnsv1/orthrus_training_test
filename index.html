<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orthrus Training</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --green: #3fb950;
      --cyan: #58a6ff;
      --yellow: #d2991d;
      --magenta: #bc8cff;
      --red: #f85149;
      --text: #c9d1d9;
      --muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 24px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .controls select,
    .controls button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .controls button:hover {
      background: var(--border);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
    }

    .stat-card .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .stat-card .delta {
      font-size: 12px;
      margin-top: 2px;
    }

    .stat-card canvas {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.3;
      pointer-events: none;
    }

    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .chart-card h2 {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .chart-card .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 8px;
    }

    .chart-card .tabs button {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .chart-card .tabs button.active {
      color: var(--text);
      border-bottom-color: var(--green);
    }

    .chart-wrap {
      position: relative;
      height: 320px;
    }

    .chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .delta-up {
      color: var(--green);
    }

    .delta-down {
      color: var(--red);
    }

    .delta-flat {
      color: var(--muted);
    }

    #status {
      font-size: 12px;
      color: var(--muted);
      min-width: 180px;
      display: inline-block;
      text-align: right;
    }
  </style>
</head>
<body>
  <header>
    <h1>Orthrus SmolLM2 Training</h1>
    <div class="controls">
      <button onclick="resetView()">↺ Reset</button>
      <button onclick="resetZoom()">⊞ Zoom Reset</button>
      <button onclick="poll()">↻ Refresh</button>
      <label style="font-size:12px;color:var(--muted);margin-left:4px">From</label>
      <input id="fromStep" type="number" value="0" min="0" step="100"
        style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;width:80px"
        onchange="applyFilter()">
      <select id="poll" onchange="startPoll(this.value)">
        <option value="1" selected>1s</option>
        <option value="2">2s</option>
        <option value="5">5s</option>
        <option value="15">15s</option>
        <option value="60">60s</option>
      </select>
      <span id="status"></span>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">KL Loss</div>
      <div class="value" id="kl-val" style="color:var(--green)">—</div>
      <div class="delta" id="kl-delta"></div>
      <canvas id="kl-spark" width="120" height="40"></canvas>
    </div>
    <div class="stat-card">
      <div class="label">Validation KL</div>
      <div class="value" id="vkl-val" style="color:var(--cyan)">—</div>
      <div class="delta" id="vkl-delta"></div>
      <canvas id="vkl-spark" width="120" height="40"></canvas>
    </div>
    <div class="stat-card">
      <div class="label">Acceptance Rate</div>
      <div class="value" id="acc-val" style="color:var(--yellow)">—</div>
      <div class="delta" id="acc-delta"></div>
      <canvas id="acc-spark" width="120" height="40"></canvas>
    </div>
    <div class="stat-card">
      <div class="label">Gradient Norm</div>
      <div class="value" id="gn-val" style="color:var(--magenta)">—</div>
      <div class="delta" id="gn-delta"></div>
      <canvas id="gn-spark" width="120" height="40"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <div class="tabs">
      <button class="active" onclick="switchChart('loss')">KL Loss</button>
      <button onclick="switchChart('val')">Val KL</button>
      <button onclick="switchChart('acc')">Acceptance %</button>
      <button onclick="switchChart('gn')">Grad Norm</button>
      <button onclick="switchChart('all')">All</button>
    </div>
    <div class="chart-wrap"><canvas id="main"></canvas></div>
  </div>

  <div class="chart-card">
    <h2>Δ Val KL (descent rate per eval)</h2>
    <div class="chart-wrap"><canvas id="logChart"></canvas></div>
  </div>

  <script>
    const C = { loss: '#3fb950', val: '#58a6ff', acc: '#d2991d', gn: '#bc8cff' };
    const zoomPlug = { zoom: { drag: { enabled: true }, mode: 'x' }, pan: { enabled: true, mode: 'x' } };

    /* ----- alias-aware field lookup ----- */
    function pick(obj, keys) {
      for (const k of keys) {
        if (obj && obj[k] !== undefined && obj[k] !== null) return obj[k];
      }
      return null;
    }

    function hasMetric(obj, keys) {
      return pick(obj, keys) !== null;
    }

    /* ----- metric alias sets ----- */
    const LOSS_KEYS   = ['loss', 'train_loss'];
    const VAL_KL_KEYS = ['val_kl', 'valkl', 'validation_kl', 'eval_kl'];
    const ACC_KEYS    = ['accept_rate', 'acceptrate', 'acceptance_rate'];
    const GN_KEYS     = ['grad_norm', 'gradnorm'];

    /* ----- scan backward for latest row containing a metric ----- */
    function latestMetric(rows, keys) {
      for (let i = rows.length - 1; i >= 0; --i) {
        const v = pick(rows[i], keys);
        if (v !== null) return v;
      }
      return null;
    }

    /* ----- charts ----- */
    let mainChart = new Chart(document.getElementById('main'), {
      type: 'line',
      data: {
        datasets: [
          { label: 'KL Loss', data: [], borderColor: C.loss, pointRadius: 0, tension: 0.2, yAxisID: 'y' },
          { label: 'Val KL', data: [], borderColor: C.val, pointRadius: 0, hidden: true, yAxisID: 'y' },
          { label: 'Accept %', data: [], borderColor: C.acc, pointRadius: 0, hidden: true, yAxisID: 'y1' },
          { label: 'Grad Norm', data: [], borderColor: C.gn, pointRadius: 0, hidden: true, yAxisID: 'y1' },
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 200 },
        scales: {
          x: { type: 'linear', ticks: { color: '#8b949e', maxTicksLimit: 15 }, grid: { color: '#21262d' } },
          y: { type: 'linear', position: 'left', ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
          y1: { type: 'linear', position: 'right', ticks: { color: '#8b949e' }, grid: { drawOnChartArea: false } }
        },
        plugins: { zoom: zoomPlug, legend: { display: false } }
      }
    });

    let logChart = new Chart(document.getElementById('logChart'), {
      type: 'bar',
      data: {
        datasets: [{
          label: 'Δ Val KL',
          data: [],
          backgroundColor: pts => {
            let v = pts.raw?.y || 0;
            return v > 0 ? 'rgba(63,185,80,0.6)' : 'rgba(248,81,73,0.6)';
          },
          borderColor: pts => {
            let v = pts.raw?.y || 0;
            return v > 0 ? '#3fb950' : '#f85149';
          },
          barThickness: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 200 },
        scales: {
          x: { type: 'linear', ticks: { color: '#8b949e', maxTicksLimit: 15 }, grid: { color: '#21262d' } },
          y: { type: 'linear', ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }
        },
        plugins: { zoom: zoomPlug, legend: { display: false } }
      }
    });

    let allPoints = [], pollTimer, prevVals = {}, fromStep = 0;

    function applyFilter() {
      fromStep = parseInt(document.getElementById('fromStep').value) || 0;
      renderAll(allPoints);
    }

    let sparkCharts = {};

    function makeSpark(id, color) {
      return new Chart(id, {
        type: 'line',
        data: {
          datasets: [{ data: [], borderColor: color, pointRadius: 0, borderWidth: 1 }]
        },
        options: {
          animation: false,
          maintainAspectRatio: true,
          scales: { x: { display: false }, y: { display: false } },
          plugins: { legend: { display: false } }
        }
      });
    }

    sparkCharts.loss = makeSpark('kl-spark', C.loss);
    sparkCharts.val  = makeSpark('vkl-spark', C.val);
    sparkCharts.acc  = makeSpark('acc-spark', C.acc);
    sparkCharts.gn   = makeSpark('gn-spark', C.gn);

    function switchChart(mode) {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      let ds = mainChart.data.datasets;
      let showAll = mode === 'all';
      ds[0].hidden = !(showAll || mode === 'loss'); ds[0].label = 'KL Loss';
      ds[1].hidden = !(showAll || mode === 'val');  ds[1].label = 'Val KL';
      ds[2].hidden = !(showAll || mode === 'acc');  ds[2].label = 'Accept %';
      ds[3].hidden = !(showAll || mode === 'gn');   ds[3].label = 'Grad Norm';
      mainChart.options.plugins.legend.display = showAll;
      mainChart.update();
    }

    function deltaClass(cur, prev, lowerIsBetter) {
      if (prev == null || prev === 0) return 'delta-flat';
      let pct = (cur - prev) / Math.abs(prev || 1);
      if (lowerIsBetter) pct = -pct;
      if (pct < -0.01) return 'delta-down';
      if (pct > 0.01) return 'delta-up';
      return 'delta-flat';
    }

    function deltaSign(cur, prev, lowerIsBetter) {
      if (prev == null || prev === 0) return '';
      let pct = ((cur - prev) / Math.abs(prev || 1)) * 100;
      if (lowerIsBetter) pct = -pct;
      return pct > 0 ? '+' + pct.toFixed(1) + '%' : pct.toFixed(1) + '%';
    }

    function updateStat(valId, deltaId, val, fmt, lowerIsBetter) {
      let el = document.getElementById(valId);
      let prev = prevVals[valId];
      el.textContent = typeof fmt === 'function' ? fmt(val) : (val != null ? val.toFixed(2) : '—');
      let d = document.getElementById(deltaId);
      d.textContent = deltaSign(val, prev, lowerIsBetter);
      d.className = 'delta ' + deltaClass(val, prev, lowerIsBetter);
      prevVals[valId] = val;
    }

    /* ----- data loading (full replace, no stale-append) ----- */
    function loadAll() {
      fetch('/data', { cache: 'no-store' })
        .then(r => r.json())
        .then(d => {
          allPoints = d;
          renderAll(d);
          document.getElementById('status').textContent =
            d.length + ' pts · step ' + (d[d.length - 1]?.step ?? '?');
        })
        .catch(() => document.getElementById('status').textContent = '⚡ waiting...');
    }

    function poll() {
      document.getElementById('status').textContent = '↻ loading...';
      fetch('/data', { cache: 'no-store' })
        .then(r => r.json())
        .then(d => {
          allPoints = d;
          renderAll(allPoints);
          document.getElementById('status').textContent =
            allPoints.length + ' pts · step ' + (allPoints[allPoints.length - 1]?.step ?? '?');
        })
        .catch(e => { document.getElementById('status').textContent = '⚠ ' + e.message; });
    }

    /* ----- render ----- */
    function renderAll(pts) {
      pts = pts.filter(p => p.step >= fromStep);

      /* build alias-normalised arrays */
      let kl = pts.filter(p => hasMetric(p, LOSS_KEYS) && !hasMetric(p, VAL_KL_KEYS)),
          vk = pts.filter(p => hasMetric(p, VAL_KL_KEYS)),
          ac = pts.filter(p => hasMetric(p, ACC_KEYS)),
          gn = pts.filter(p => hasMetric(p, GN_KEYS));

      mainChart.data.datasets[0].data = kl.map(p => ({ x: p.step, y: pick(p, LOSS_KEYS) }));
      mainChart.data.datasets[1].data = vk.map(p => ({ x: p.step, y: pick(p, VAL_KL_KEYS) }));
      mainChart.data.datasets[2].data = ac.map(p => ({ x: p.step, y: pick(p, ACC_KEYS) * 100 }));
      mainChart.data.datasets[3].data = gn.map(p => ({ x: p.step, y: pick(p, GN_KEYS) }));

      sparkCharts.loss.data.datasets[0].data = kl.slice(-200).map(p => pick(p, LOSS_KEYS));
      sparkCharts.val.data.datasets[0].data  = vk.slice(-200).map(p => pick(p, VAL_KL_KEYS));
      sparkCharts.acc.data.datasets[0].data  = ac.slice(-200).map(p => pick(p, ACC_KEYS) * 100);
      sparkCharts.gn.data.datasets[0].data   = gn.slice(-200).map(p => pick(p, GN_KEYS));

      sparkCharts.loss.update();
      sparkCharts.val.update();
      sparkCharts.acc.update();
      sparkCharts.gn.update();
      mainChart.update();

      /* Δ Val KL bar chart */
      let vkVals = vk.map(p => pick(p, VAL_KL_KEYS));
      logChart.data.datasets[0].data = vk.length > 1
        ? vk.slice(1).map((p, i) => ({ x: p.step, y: -(vkVals[i + 1] - vkVals[i]) }))
        : [];
      logChart.update();

      /* stat cards: scan backward for latest row containing each metric */
      updateStat('kl-val',  'kl-delta',  latestMetric(pts, LOSS_KEYS), null, true);
      updateStat('vkl-val', 'vkl-delta', latestMetric(pts, VAL_KL_KEYS), null, true);
      updateStat('gn-val',  'gn-delta',  latestMetric(pts, GN_KEYS), null, true);

      let latestAcc = latestMetric(pts, ACC_KEYS);
      updateStat('acc-val', 'acc-delta',
        latestAcc != null ? latestAcc * 100 : null,
        v => v != null ? v.toFixed(1) + '%' : '—', false);
    }

    /* ----- polling ----- */
    function startPoll(sec) {
      clearInterval(pollTimer);
      pollTimer = setInterval(poll, sec * 1000);
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { poll(); startPoll(document.getElementById('poll').value); }
    });

    /* ----- reset ----- */
    function resetView() {
      allPoints = [];
      fromStep = 0;
      document.getElementById('fromStep').value = 0;
      mainChart.data.datasets.forEach(d => d.data = []);
      logChart.data.datasets[0].data = [];
      Object.values(sparkCharts).forEach(s => s.data.datasets[0].data = []);
      mainChart.update();
      logChart.update();
      Object.values(sparkCharts).forEach(s => s.update());
      prevVals = {};
      ['kl-val', 'vkl-val', 'acc-val', 'gn-val'].forEach(id => {
        document.getElementById(id).textContent = '—';
        document.getElementById(id.replace('-val', '-delta')).textContent = '';
      });
    }

    function resetZoom() { mainChart.resetZoom(); }

    loadAll();
    startPoll(1);
  </script>
</body>
</html>
